<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071827" />
  <meta name="description" content="Offline-first antimicrobial decision reference for intensive care, infectious diseases and trainees, with structured Malaysian sources, renal/RRT tools and stewardship workflows." />
  <title>AbxHub</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.18.0" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=0.18.0" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Home">
        <img class="brand-logo" src="./icons/icon-192.png" alt="" aria-hidden="true" />
        <span class="brand-copy"><strong>AbxHub</strong><small>Antimicrobial Clinical Reference</small></span>
      </button>
      <div class="top-actions">
        <button id="installBtn" class="icon-btn" aria-label="Install app" title="Install PWA" hidden>↓</button>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">◐</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-nav="home" class="active"><span>⌂</span><small>Home</small></button>
      <button data-nav="diseases"><span>✚</span><small>Diseases</small></button>
      <button data-nav="drugs"><span>Rx</span><small>Drugs</small></button>
      <button data-nav="organisms"><span>◉</span><small>Organisms</small></button>
      <button data-nav="tools"><span>⚙</span><small>Tools</small></button>
    </nav>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-handle"></div>
      <div class="modal-head"><h2 id="modalTitle">Details</h2><button class="icon-btn" data-close-modal aria-label="Close">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>This PWA requires JavaScript.</noscript>
  <script src="./app.js?v=0.18.0" defer></script>
</body>
</html>
